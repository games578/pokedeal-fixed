<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PokéDeals settings</title>
  <style>
    body {
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 300px;
      padding: 14px;
      background: #17181c;
      color: #f2f2f2;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px;
    }
    label {
      display: block;
      font-size: 12px;
      color: #9ca3af;
      margin-top: 10px;
      margin-bottom: 4px;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      background: #0f1013;
      border: 1px solid #33343a;
      border-radius: 6px;
      color: #f2f2f2;
      padding: 6px 8px;
      font-size: 13px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      margin-top: 14px;
      width: 100%;
      background: #2563eb;
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #1d4ed8; }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #4ade80;
      min-height: 16px;
    }
    #status.error { color: #f87171; }
    .hint {
      font-size: 11px;
      color: #6b7280;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>PokéDeals settings</h1>

  <label for="appUrl">Your deployed app URL</label>
  <input id="appUrl" type="text" placeholder="https://your-app.vercel.app" />
  <div class="hint">No trailing slash needed.</div>

  <label for="apiToken">API token (optional)</label>
  <input id="apiToken" type="password" placeholder="Only needed if you set EXTENSION_API_TOKEN" />

  <div class="row">
    <input id="gridEnabled" type="checkbox" />
    <label for="gridEnabled" style="margin:0;color:#f2f2f2;">Show badges on search/browse grids</label>
  </div>

  <button id="save">Save & connect</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
